global:
  scrape_interval: 15s

scrape_configs:
  - job_name: mini-payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9091"]

  - job_name: mini-payment-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9092"]

  - job_name: mini-payment-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9093"]
